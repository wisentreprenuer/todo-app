<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet"
    />
    <title>todo-app</title>
  </head>
  <body class="bg-gray-200 font-dm-sans">
    <!-- Containter -->
    <div class="min-h-screen mx-auto w-100 flex flex-col items-center">
      <!-- Header Section -->
      <header class="relative top-0 z-50 pt-8 w-100 mx-auto mb-2 bg-gray-200 flex flex-col items-center">
        <h1 class=" font-bold text-2xl text-[#27286e]">Today's Tasks</h1>
        <div class="text-gray-400">
          <span id="completed">0</span>
          of
          <span id="total-tasks">5</span>
          done
        </div>

        <div class="w-full formSection flex justify-center">
          <form id="searchForm" class="w-full">
            <!-- Search Search -->
            <label
              for="searchInput"
              class="w-full flex items-center mt-1 bg-white outline-2 outline-gray-100 rounded-2xl pl-7 py-2 text-[10px] relative"
            >
              <!-- Search Icon -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="21"
                height="21"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#999999"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-search preview-icon opacity-[0.3] pl-1 absolute left-1"
              >
                <path d="m21 21-4.34-4.34" />
                <circle cx="11" cy="11" r="8" />
              </svg>

              <!--Search Input  -->
              <input
                type="text"
                name=""
                id="searchInput"
                placeholder=""
                autocomplete="off"
                class="w-full pr-3 text-sm outline-0 placeholder:text-gray-300 placeholder:text-center placeholder:text-xs placeholder:italic caret-[#27286e] text-[#27286e]"
              />
            </label>
          </form>
        </div>
        <button title="Clear All Tasks" class="clear-all absolute -right-19 bottom-0 w-20 border-none flex flex-row justify-between px-3 py-2 text-[8px] text-gray-400 rounded cursor-pointer hover:text-gray-700 hover:scale-[0.95] transition-all duration-300">
          <!-- <span> Clear all </span> -->
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class=" lucide lucide-trash preview-icon "><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
        <button class="sort-all absolute -right-30 bottom-0 w-20 border-none flex flex-row justify-between px-3 py-2 text-[8px] text-gray-400 rounded cursor-pointer hover:text-gray-700 hover:scale-[0.95] transition-all duration-300">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class=" lucide lucide-list-sort-descending preview-icon"><path d="M15 12H3"/><path d="M3 5h18"/><path d="M9 19H3"/></svg>
        </button>
      </header>

      <!-- List of Tasks -->
      <section class="w-full">
        <ul id="taskList" class="max-w-screen min-h-[50vh] pb-30 flex flex-col items-center gap-y-2">
          
        </ul>
      </section>


      <!-- Add Task Button -->
      <section>
        <div class="absolute bottom-5 right-[30vw]">
          <button
            id="addTaskBtn"
            class="cursor-pointer hover:scale-[0.95] bg-[#89be2b] text-white font-bold p-4 rounded-full transition-all duration-100"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-plus preview-icon"
            >
              <path d="M5 12h14" />
              <path d="M12 5v14" />
            </svg>
          </button>
        </div>
      </section>

      <!-- Popup Section -->
      <section class="flex justify-center">
        <div id="popup" class="hidden w-100 h-auto">
        <form id="addTaskForm">
          <label for="taskInput" class="text-[#27286e] font-bold cursor-pointer">
            What are we doing next?
          </label>
          <input
            autocomplete="off"
            type="text"
            name=""
            id="taskInput"
            class="w-full mt-3 py-2 px-1 block bg-white border border-gray-300 rounded outline-0 text-xs text-[#27286e] caret-[#27286e]"
          />
          <button
            type="submit"
            class="w-36 flex justify-between items-center text-xs font-bold bg-[#89be2b] text-white mt-4 px-6 py-3 rounded cursor-pointer transition-transform duration-200 hover:scale-[0.95]"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-plus preview-icon"
            >
              <path d="M5 12h14" />
              <path d="M12 5v14" />
            </svg>

            <span class="">Add Task</span>
          </button>
        </form>
      </div>
      </section>
      

      <!-- End of Page Container -->
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
